name: Update Tailscale access graph

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - policy/grants.json
      - policy/ssh.json
      - scripts/policy-graph.py
      - .github/workflows/access-graph.yml

concurrency:
  group: access-graph-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes graphviz

      - name: Generate access graph
        run: |
          python3 scripts/policy-graph.py policy/grants.json policy/ssh.json \
            > "$RUNNER_TEMP/access-graph.dot"
          mkdir -p docs
          dot -Tsvg "$RUNNER_TEMP/access-graph.dot" -o docs/access-graph.svg

      - name: Commit graph when changed
        env:
          ACCESS_GRAPH_TOKEN: ${{ secrets.ACCESS_GRAPH_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/access-graph.svg
          if git diff --cached --quiet -- docs/access-graph.svg; then
            echo "Access graph is unchanged"
            exit 0
          fi
          if [ -z "${ACCESS_GRAPH_TOKEN:-}" ]; then
            echo "::error::Set the ACCESS_GRAPH_TOKEN repository secret to push generated graph updates."
            exit 1
          fi
          git commit -m "Update Tailscale access graph"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ACCESS_GRAPH_TOKEN" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=$auth_header" \
            push origin "HEAD:refs/heads/${HEAD_REF}"
