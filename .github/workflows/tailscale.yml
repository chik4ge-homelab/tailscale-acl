name: Sync Tailscale ACLs

on:
  push:
    branches: [main]
    paths:
      - policy/**
      - secrets.sops.json
      - scripts/render-policy.sh
      - .github/workflows/tailscale.yml
  pull_request:
    branches: [main]
    paths:
      - policy/**
      - secrets.sops.json
      - scripts/render-policy.sh
      - .github/workflows/tailscale.yml
  workflow_dispatch:

jobs:
  policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TAILSCALE_READ_CREDENTIALS_CONFIGURED: >-
        ${{ vars.TS_OAUTH_ID_READ != '' && vars.TS_AUDIENCE_READ != '' && vars.TS_TAILNET != '' }}
      TAILSCALE_WRITE_CREDENTIALS_CONFIGURED: >-
        ${{ vars.TS_OAUTH_ID_WRITE != '' && vars.TS_AUDIENCE_WRITE != '' && vars.TS_TAILNET != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install SOPS
        env:
          SOPS_VERSION: 3.13.3
        run: |
          curl -fsSL \
            -o "sops-v${SOPS_VERSION}.linux.amd64" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          curl -fsSL \
            -o checksums.txt \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.checksums.txt"
          grep "sops-v${SOPS_VERSION}.linux.amd64$" checksums.txt | sha256sum --check -
          sudo install -m 0755 "sops-v${SOPS_VERSION}.linux.amd64" /usr/local/bin/sops

      - name: Render policy
        id: render
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: scripts/render-policy.sh

      - name: Test policy
        if: github.event_name == 'pull_request' && env.TAILSCALE_READ_CREDENTIALS_CONFIGURED == 'true'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_ID_READ }}
          audience: ${{ vars.TS_AUDIENCE_READ }}
          tailnet: ${{ vars.TS_TAILNET }}
          policy-file: ${{ steps.render.outputs.policy_file }}
          action: test

      - name: Apply policy
        if: github.event_name == 'push' && env.TAILSCALE_WRITE_CREDENTIALS_CONFIGURED == 'true'
        uses: tailscale/gitops-acl-action@v1
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_ID_WRITE }}
          audience: ${{ vars.TS_AUDIENCE_WRITE }}
          tailnet: ${{ vars.TS_TAILNET }}
          policy-file: ${{ steps.render.outputs.policy_file }}
          action: apply

      - name: Remove rendered policy
        if: always()
        env:
          POLICY_FILE: ${{ steps.render.outputs.policy_file }}
        run: |
          if [ -n "${POLICY_FILE}" ]; then
            rm -f -- "${POLICY_FILE}"
            rmdir -- "$(dirname -- "${POLICY_FILE}")" 2>/dev/null || true
          fi
